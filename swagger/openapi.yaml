openapi: 3.0.3
info:
  title: Clothica API
  version: 1.1.0
  description: "REST API інтернет-магазину Clothica. Документ звірено з фактичними роутерами, контролерами, Joi-схемами й Mongoose-моделями гілки main після PR #34 (коміт 0ad157f, 10.11.2026). Описано 17 HTTP-операцій. Ендпоінти Users PATCH, Feedbacks GET/POST і Subscriptions POST ще не реалізовані: їхні контролери порожні й можуть не завершувати запит. Відомі обмеження у створенні замовлення та скиданні пароля зазначені біля операцій. Валідація за відсутніх/додаткових полів виконується Joi/Celebrate. Swagger описує поточну реалізацію, але не виправляє ці обмеження."
servers:
  - url: http://localhost:4000
    description: Локальний Express API
tags:
  - name: Auth
    description: Реєстрація, вхід, завершення й оновлення сесії, відновлення пароля.
  - name: Users
    description: Профіль поточного користувача (потрібна сесія).
  - name: Categories
    description: Категорії каталогу.
  - name: Goods
    description: Товари, пошук за фільтрами, пагінація.
  - name: Orders
    description: Оформлення замовлень, історія користувача та зміна статусу адміністратором.
  - name: Feedbacks
    description: Відгуки (контролери ще не реалізовані).
  - name: Subscriptions
    description: Підписка (контролер ще не реалізований).
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Реєстрація користувача
      operationId: registerUser
      description: Публічний маршрут. Реєстрація за ім’ям, телефоном, email та паролем. Поля профілю surname, city, postOffice не потрібні під час реєстрації. Пароль хешується bcrypt і не повертається. За успішної реєстрації створюється сесія й установлюються три HttpOnly cookies. Якщо email або телефон уже зайняті, повертається 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Користувача зареєстровано; встановлені cookies сесії.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          headers:
            Set-Cookie:
              description: "Три заголовки Set-Cookie: accessToken, refreshToken, sessionId."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email або телефон уже зайняті.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Вхід за номером телефону та паролем
      operationId: loginUser
      description: Публічний маршрут. За правильних даних створює сесію та встановлює HttpOnly cookies accessToken, refreshToken, sessionId. Відповідь містить user.id і user.phone (не tel).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserRequest"
      responses:
        "200":
          description: Успішний вхід.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          headers:
            Set-Cookie:
              description: Три заголовки Set-Cookie для сесії.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Неправильний телефон або пароль.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Вихід з облікового запису
      operationId: logoutUser
      description: Маршрут не має обов’язкового middleware authorization. Якщо cookie sessionId передано, контролер видаляє відповідну сесію; після цього очищає три cookies. Навіть без cookie відповідає 204.
      responses:
        "204":
          description: Сесію завершено; тіло відповіді відсутнє.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Оновлення сесії за refreshToken
      operationId: refreshUserSession
      description: Потрібні cookies sessionId і refreshToken. Стара сесія видаляється, створюється нова, встановлюються нові три cookies. Термін дії refreshToken — 1 доба.
      security:
        - sessionIdCookie: []
          refreshTokenCookie: []
      responses:
        "200":
          description: Нову сесію створено.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
          headers:
            Set-Cookie:
              description: Три оновлені заголовки Set-Cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/request-reset-email:
    post:
      tags:
        - Auth
      summary: Запросити лист для відновлення пароля
      operationId: requestResetEmail
      description: Публічний маршрут. Для наявного email надсилається лист із JWT-токеном терміном дії 15 хвилин. Для неіснуючого email також повертає 200, щоб не розкривати наявність акаунта.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestResetEmailRequest"
      responses:
        "200":
          description: Запит опрацьовано; відповідь однакова для наявного й відсутнього email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestResetEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: Не вдалося надіслати лист або сталася помилка сервера.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /api/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Встановити новий пароль за токеном
      operationId: resetPassword
      description: "Публічний маршрут. Перевіряє підпис JWT і термін його дії (15 хв), змінює пароль та видаляє всі сесії користувача. Відоме обмеження: токен не стає одноразовим і може повторно використовуватися до закінчення терміну дії."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Пароль змінено.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Недійсний або прострочений токен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users:
    get:
      tags:
        - Users
      summary: Отримати власний профіль
      operationId: getCurrentUser
      description: "Вимагає авторизації через cookies accessToken і sessionId. Повертає {user: ...} без пароля."
      security:
        - sessionIdCookie: []
          accessTokenCookie: []
      responses:
        "200":
          description: Поточний користувач.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - Users
      summary: Оновити власний профіль — ще НЕ реалізовано
      operationId: updateCurrentUser
      description: Маршрут захищений authorization, але контролер updateCurrentUser наразі порожній і не надсилає відповіді. Формат PATCH ще не погоджений; не використовуйте для реальних запитів.
      security:
        - sessionIdCookie: []
          accessTokenCookie: []
      requestBody:
        required: false
        description: Тимчасова заглушка. Поля ще не визначені командою.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnspecifiedRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          description: Контролер ще не реалізований; успішна відповідь наразі не визначена (запит може залишитися без відповіді).
  /api/categories:
    get:
      tags:
        - Categories
      summary: Список категорій із пагінацією
      operationId: getCategories
      parameters:
        - name: page
          in: query
          description: Номер сторінки.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          description: Кількість категорій на сторінці.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
      responses:
        "200":
          description: Категорії й метадані пагінації.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/goods:
    get:
      tags:
        - Goods
      summary: Каталог товарів із фільтрацією і пагінацією
      operationId: getGoods
      description: Фільтри можна поєднувати. Якщо вказано обидві ціни, minPrice не може бути більшим за maxPrice.
      parameters:
        - name: page
          in: query
          description: Номер сторінки.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          description: Кількість товарів на сторінці.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 12
        - name: category
          in: query
          description: ObjectId категорії.
          schema:
            $ref: "#/components/schemas/ObjectId"
        - name: gender
          in: query
          description: Призначення товару.
          schema:
            type: string
            enum:
              - women
              - man
              - unisex
        - name: size
          in: query
          description: Розмір товару.
          schema:
            type: string
            enum:
              - XL
              - XS
              - S
              - M
              - L
              - XXL
        - name: minPrice
          in: query
          description: Ціна від, включно.
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          description: Ціна до, включно.
          schema:
            type: number
            minimum: 0
      responses:
        "200":
          description: Товари й метадані пагінації.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/goods/{goodsId}:
    get:
      tags:
        - Goods
      summary: Один товар за MongoDB ObjectId
      operationId: getGoodById
      parameters:
        - name: goodsId
          in: path
          required: true
          description: Ідентифікатор товару.
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Об’єкт товару без додаткової обгортки.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Good"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/orders:
    get:
      tags:
        - Orders
      summary: Останні п’ять замовлень поточного користувача
      operationId: getOrders
      description: "Доступний лише авторизованому користувачу. Повертає масив до 5 замовлень, відсортованих за createdAt від нових до старих; проєкція полів: _id, createdAt, orderNumber, amount, status. Поточний ліміт .limit(5) залишено без змін."
      security:
        - sessionIdCookie: []
          accessTokenCookie: []
      responses:
        "200":
          description: Масив замовлень.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Orders
      summary: Створити замовлення (можна без авторизації)
      operationId: createOrder
      description: "Публічний маршрут. Контролер самостійно генерує orderNumber; status за замовчуванням inProcess. Поточна реалізація зберігає userId: null навіть коли cookies авторизованого користувача передані — це відомий баг, переданий іншому розробнику. У Joi quantity і goodId у позиції не позначені як required, але в Mongoose-моделі вони обов’язкові; для успішного замовлення передавайте обидва поля. Відоме обмеження: amount і status наразі приймаються від клієнта без серверного перерахунку/захисту від підміни."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Замовлення створено.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/orders/{orderId}:
    patch:
      tags:
        - Orders
      summary: Змінити статус замовлення (тільки адміністратор)
      operationId: updateOrderStatus
      description: Потрібні авторизація та роль admin. Контролер приймає один із чотирьох статусів. Joi-валідація параметра orderId і тіла PATCH зараз не підключена; некоректний ObjectId може спричинити 500.
      security:
        - sessionIdCookie: []
          accessTokenCookie: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: MongoDB ObjectId замовлення.
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Замовлення з оновленим статусом.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Статус не входить до дозволеного переліку.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/feedbacks:
    get:
      tags:
        - Feedbacks
      summary: Відгуки товару — ще НЕ реалізовано
      operationId: getFeedbacks
      description: Joi перевіряє query, але контролер getFeedbacks порожній і не надсилає відповіді.
      parameters:
        - name: page
          in: query
          description: Номер сторінки (Joi не встановлює default).
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          description: Кількість відгуків на сторінці.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 12
        - name: productId
          in: query
          required: true
          description: MongoDB ObjectId товару.
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          description: Контролер ще не реалізований; формат успішної відповіді невідомий (запит може залишитися без відповіді).
    post:
      tags:
        - Feedbacks
      summary: Створити відгук — ще НЕ реалізовано
      operationId: createFeedback
      description: Тіло валідоване Joi, але контролер createFeedback порожній і не надсилає відповіді. Поля date і category в POST не передаються.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          description: Контролер ще не реалізований; формат успішної відповіді невідомий (запит може залишитися без відповіді).
  /api/subscriptions:
    post:
      tags:
        - Subscriptions
      summary: Підписка на розсилку — ще НЕ реалізовано
      operationId: createSubscription
      description: Роут є, але контролер порожній, модель Subscription має порожню схему, а Joi-валідація не підключена. Формат запиту та відповіді команда ще не погодила.
      requestBody:
        required: false
        description: Тимчасова заглушка без затверджених полів.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnspecifiedRequest"
      responses:
        default:
          description: Контролер ще не реалізований; формат успішної відповіді невідомий (запит може залишитися без відповіді).
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: accessToken
      description: Короткоживучий HttpOnly cookie (15 хв). Видається під час register/login/refresh.
    sessionIdCookie:
      type: apiKey
      in: cookie
      name: sessionId
      description: HttpOnly cookie з MongoDB ID сесії (1 доба).
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HttpOnly cookie для оновлення сесії (1 доба).
  responses:
    BadRequest:
      description: Joi/Celebrate повертає 400 для невалідних вхідних даних.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationError"
              - $ref: "#/components/schemas/Message"
    Unauthorized:
      description: Дані сесії відсутні, недійсні або строк їх дії завершився.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    Forbidden:
      description: "Недостатньо прав: потрібна роль admin."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    NotFound:
      description: Ресурс не знайдено.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    InternalError:
      description: Помилка сервера. У production повертається узагальнене повідомлення.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
  schemas:
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      description: MongoDB ObjectId (24 шістнадцяткові символи).
      example: 6877b9f116ae59c7b60d0135
    Message:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Something went wrong. Please try again later.
    ValidationError:
      type: object
      required:
        - statusCode
        - error
        - message
      properties:
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        validation:
          type: object
          additionalProperties: true
          description: "Деталі перевірки: query/body/params, keys, message."
    User:
      type: object
      required:
        - _id
        - email
        - name
        - role
        - tel
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        email:
          type: string
          format: email
          example: olena@example.com
        role:
          type: string
          enum:
            - user
            - admin
          example: user
        name:
          type: string
          example: Олена
        surname:
          type: string
          description: Необов’язкове поле профілю.
          example: Коваленко
        tel:
          type: string
          pattern: ^0[0-9]{9}$
          example: 0991234567
        city:
          type: string
          description: Необов’язкове поле профілю.
          example: Київ
        postOffice:
          type: integer
          minimum: 1
          description: Необов’язковий номер відділення.
          example: 12
        createdAt:
          type: string
          format: date-time
          example: "2026-11-09T21:48:03.577Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-09T21:48:03.577Z"
        __v:
          type: integer
          example: 0
      description: Публічна форма User; поле password не включається до JSON.
    RegisterUserRequest:
      type: object
      required:
        - name
        - tel
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
