    CreateOrderRequest:
      type: object
      required:
        - name
        - surname
        - tel
        - city
        - postOffice
        - amount
        - goodsOrderList
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 30
          example: Олена
        surname:
          type: string
          minLength: 3
          maxLength: 30
          example: Коваленко
        tel:
          type: string
          pattern: ^[0-9]{10}$
          example: 0991234567
        city:
          type: string
          minLength: 3
          maxLength: 30
          example: Київ
        postOffice:
          type: integer
          minimum: 1
          maximum: 999999
          example: 12
        comment:
          type: string
          minLength: 3
          maxLength: 300
          example: Доставка після 15:00
        amount:
          type: integer
          minimum: 1
          maximum: 50000
          description: Поточна реалізація приймає цю суму від клієнта без перерахунку на сервері.
          example: 2599
        status:
          allOf:
            - $ref: "#/components/schemas/OrderStatus"
          description: Необов’язкове поле. Joi дозволяє встановлювати статус клієнтом; за замовчуванням inProcess.
        goodsOrderList:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderedGood"
      additionalProperties: false
    Order:
      type: object
      required:
        - _id
        - name
        - surname
        - tel
        - city
        - postOffice
        - orderNumber
        - amount
        - status
        - goodsOrderList
        - createdAt
        - updatedAt
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
          example: Олена
        surname:
          type: string
          example: Коваленко
        tel:
          type: string
          example: 0991234567
        city:
          type: string
          example: Київ
        postOffice:
          type: integer
          minimum: 1
          example: 12
        comment:
          type: string
          example: Доставка після 15:00
        orderNumber:
          type: integer
          example: 7
        amount:
          type: integer
          example: 2599
        status:
          $ref: "#/components/schemas/OrderStatus"
        goodsOrderList:
          type: array
          items:
            $ref: "#/components/schemas/OrderedGood"
        userId:
          type: string
          nullable: true
          pattern: ^[0-9a-fA-F]{24}$
          example: null
          description: MongoDB ObjectId або null. Поточний POST зазвичай зберігає null (відомий баг прив’язки до користувача).
        createdAt:
          type: string
          format: date-time
          example: "2026-11-09T22:10:35.698Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-11-09T22:10:35.698Z"
    OrderSummary:
      type: object
      required:
        - _id
        - createdAt
        - orderNumber
        - amount
        - status
      properties:
