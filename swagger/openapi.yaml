openapi: 3.0.3
info:
  title: Clothica API
  version: 1.3.0
  description: Документація API Clothica, актуалізована за main репозиторію backend-final-project станом на 18.11.2026. 19 HTTP-операцій. Телефон — +380XXXXXXXXX. Авторизація використовує HttpOnly cookies sessionId/accessToken/refreshToken. У Swagger UI браузер автоматично передає cookies того самого хоста; для тестування на HTTP localhost атрибут Secure/SameSite=None у cookies може перешкоджати збереженню сесії. API /api-docs доступний на локальному або розгорнутому Express-сервері.
servers:
  - url: /
    description: Поточний Express-сервер (localhost або Render)
tags:
  - name: Auth
    description: Реєстрація, логін, сесії, відновлення пароля
  - name: Users
    description: Профіль поточного користувача
  - name: Categories
    description: Категорії каталогу
  - name: Goods
    description: Товари, популярні товари, фільтри й рейтинг
  - name: Feedbacks
    description: Отримання та додавання відгуків
  - name: Orders
    description: Оформлення, історія та адміністрування замовлень
  - name: Subscriptions
    description: Підписка за електронною поштою
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Реєстрація користувача
      operationId: registerUser
      description: Публічний маршрут. Створює User, одразу створює сесію і встановлює HttpOnly cookies. Дубль tel/email -> 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: "Користувача створено; Set-Cookie: accessToken, refreshToken, sessionId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Вхід за телефоном і паролем
      operationId: loginUser
      description: Публічний маршрут. У відповіді loginUser повертає user.phone (не tel). Після входу встановлює 3 HttpOnly cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserRequest"
      responses:
        "200":
          description: Успішна авторизація і встановлення cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Вихід із системи
      operationId: logoutUser
      description: Видаляє сесію за cookie sessionId, якщо cookie передано, й очищає cookies. Авторизаційний middleware не застосовується.
      responses:
        "204":
          description: No Content — cookie очищено, тіло відповіді відсутнє
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Оновлення сесії
      operationId: refreshUserSession
      description: Вимагає sessionId та refreshToken у cookies, видаляє стару сесію, перевіряє термін дії refresh-токена, створює нову сесію та cookies.
      security:
        - sessionIdCookie: []
          refreshTokenCookie: []
      responses:
        "200":
          description: Сесію оновлено; нові cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/request-reset-email:
    post:
      tags:
        - Auth
      summary: Запит на скидання пароля
      operationId: requestResetEmail
      description: Публічний маршрут. Email trim+lowercase. Для невідомого email так само повертає 200 без надсилання. Якщо користувач існує, надсилає SMTP-лист із JWT на 15 хв; посилання формується через FRONTEND_URL. SMTP-помилка -> 500.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetEmailRequest"
      responses:
        "200":
          description: Однакова відповідь для наявного і відсутнього email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Встановити новий пароль
      operationId: resetPassword
      description: Публічний маршрут. Перевіряє JWT, хешує пароль bcrypt і видаляє всі активні сесії користувача.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Пароль змінено; активні сесії видалено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users:
    get:
      tags:
        - Users
      summary: Отримати поточного користувача
      operationId: getCurrentUser
      description: "Потребує cookie sessionId та accessToken; повертає {user: ...} без пароля."
      security: &id001
        - sessionIdCookie: []
          accessTokenCookie: []
      responses:
        "200":
          description: Поточний користувач
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - Users
      summary: Оновити профіль користувача
      operationId: updateCurrentUser
      description: Потребує чинної сесії. Поля необовʼязкові; дублікат tel повертає 400.
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Профіль змінено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/categories:
    get:
      tags:
        - Categories
      summary: Список категорій із пагінацією
      operationId: getCategories
      description: Joi приймає інші query-параметри (.unknown(true)), але сервіс їх ігнорує.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
      responses:
        "200":
          description: Категорії і метадані пагінації
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/goods:
    get:
      tags:
        - Goods
      summary: Каталог товарів із фільтрами
      operationId: getGoods
      description: Фільтри поєднуються. size приймає один розмір або список повторюваних query-параметрів (size=S&size=M). minPrice не може перевищувати maxPrice. Рейтинг та кількість відгуків додаються до кожного товару; для товарів без відгуків рейтинг 5 у цьому маршруті.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 12
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ObjectId"
          description: ID категорії
        - name: gender
          in: query
          required: false
          schema:
            type: string
            enum: &id003
              - women
              - man
              - unisex
        - name: size
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum: &id002
                - XXS
                - XL
                - XS
                - S
                - M
                - L
                - XXL
            minItems: 1
          description: Один або кілька розмірів, напр. size=S&size=M
          style: form
          explode: true
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
      responses:
        "200":
          description: Список товарів із rating/reviewsCount і пагінацією
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/goods/popular:
    get:
      tags:
        - Goods
      summary: Популярні товари за рейтингом
      operationId: getPopularGoods
      description: Сортує за середнім rating DESC, reviewsCount DESC, _id ASC. Рейтинг округлено до 1 знака; без відгуків rating=0. Відповідь data.goods без метаданих пагінації.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 12
          description: Максимальна кількість товарів
      responses:
        "200":
          description: Популярні товари у полі data.goods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopularGoodsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/goods/{goodsId}:
    get:
      tags:
        - Goods
      summary: Інформація про товар за ID
      operationId: getGoodById
      description: Окремий об’єкт товару без обгортки; містить rating/reviewsCount (за відсутності відгуків rating=5).
      parameters:
        - name: goodsId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Товар із рейтингом
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Good"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/feedbacks:
    get:
      tags:
        - Feedbacks
      summary: Список відгуків
      operationId: getFeedbacks
      description: Публічний маршрут. productId — необов’язковий query-параметр; без нього повертає відгуки всіх товарів. Сортує за _id DESC, populate(productId, name).
      parameters:
        - name: productId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ObjectId"
          description: Якщо переданий — лише відгуки цього товару
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 12
      responses:
        "200":
          description: Відгуки з метаданими сторінки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbacksResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Feedbacks
      summary: Створити відгук
      operationId: createFeedback
      description: Публічний маршрут. Перевіряє існування Good за productId (404 якщо немає), підставляє category.name, створює Feedback із датою та додає ID відгуку до Good.feedbacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
      responses:
        "201":
          description: Відгук створено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFeedbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/orders:
    get:
      tags:
        - Orders
      summary: Пʼять останніх замовлень користувача
      operationId: getOrders
      description: Потрібна сесія. Фільтр userId=req.user._id, createdAt DESC, limit(5), вибрані лише createdAt/orderNumber/amount/status.
      security: *id001
      responses:
        "200":
          description: Масив до п’яти замовлень
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Orders
      summary: Створити замовлення
      operationId: createOrder
      description: Доступно без входу. За чинної сесії optionalAuthorization додає userId з req.user; переданий клієнтом userId ігнорується та замінюється. Без сесії userId=null. orderNumber генерується сервером. status і amount приймаються з клієнтського запиту.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Створене замовлення; orderNumber згенеровано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/orders/admin:
    get:
      tags:
        - Orders
      summary: "Адмін: список усіх замовлень"
      operationId: getAllOrders
      description: Тільки admin. Сортування за createdAt DESC, пагінація, необов’язковий фільтр status. goodsOrderList.goodId заповнюється через populate лише полем name.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
      security: *id001
      responses:
        "200":
          description: Список усіх замовлень із пагінацією
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllOrdersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/orders/{orderId}:
    patch:
      tags:
        - Orders
      summary: "Адмін: змінити статус замовлення"
      operationId: updateOrderStatus
      description: Тільки admin. І orderId, і тіло {status} проходять Joi/Celebrate; після оновлення повертає повний Order.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Замовлення зі зміненим статусом
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/subscriptions:
    post:
      tags:
        - Subscriptions
      summary: Додати email до підписки
      operationId: createSubscription
      description: Публічний маршрут. Email нормалізується через trim().toLowerCase(); якщо такий email уже є — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Підписку створено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    sessionIdCookie:
      type: apiKey
      in: cookie
      name: sessionId
      description: HttpOnly cookie ID сесії MongoDB
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: accessToken
      description: HttpOnly cookie access token (15 хвилин)
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HttpOnly cookie refresh token (1 доба)
  responses:
    BadRequest:
      description: 400 — невірні дані Joi/Celebrate або помилка контролера
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Message"
              - $ref: "#/components/schemas/ValidationError"
    Unauthorized:
      description: 401 — відсутня/недійсна сесія або токен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    Forbidden:
      description: 403 — доступ тільки для admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    NotFound:
      description: 404 — запис не знайдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    Conflict:
      description: 409 — конфлікт, напр. email уже підписаний
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    InternalError:
      description: 500 — серверна помилка
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Message"
              - type: object
                properties:
                  error:
                    type: string
                additionalProperties: false
  schemas:
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      description: MongoDB ObjectId — 24 hex-символи
      example: 6877b9f116ae59c7b60d0135
    PhoneNumber:
      type: string
      pattern: ^\+380\d{9}$
      description: 'Точно збігається з PHONE_REG_EXP: /^\+380\d{9}$/'
      example: "+380991234567"
    Email:
      type: string
      format: email
      example: olena@example.com
    StrongPassword:
      type: string
      format: password
      minLength: 8
      maxLength: 128
      pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[!-~]{8,128}$
      writeOnly: true
      description: ASCII без пробілів; мінімум 1 мала, 1 велика латинська літера та 1 цифра
      example: Example123!
    Message:
      type: object
      properties:
        message:
          type: string
          example: Something went wrong. Please try again later.
      required:
        - message
      additionalProperties: true
    ValidationError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        validation:
          type: object
          additionalProperties: true
      required:
        - statusCode
        - error
        - message
      additionalProperties: true
    User:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
          example: Олена
        email:
          $ref: "#/components/schemas/Email"
        tel:
          $ref: "#/components/schemas/PhoneNumber"
        role:
          type: string
          enum:
            - user
            - admin
          example: user
        surname:
          type: string
          example: Коваленко
        city:
          type: string
          example: Київ
        postOffice:
          type: integer
          minimum: 1
          example: 12
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        __v:
          type: integer
          example: 0
      required:
        - _id
        - name
        - email
        - tel
        - role
      additionalProperties: true
      description: Відповідь User без password (toJSON приховує пароль)
    RegisterUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 32
          example: Олена
        tel:
          $ref: "#/components/schemas/PhoneNumber"
        email:
          type: string
          format: email
          maxLength: 64
          example: olena@example.com
        password:
