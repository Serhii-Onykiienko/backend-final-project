openapi: 3.0.3
info:
  title: Clothica API
  version: 1.2.0
  description: Документація Clothica API. Версія від 12.11.2026. Описано 17 HTTP операцій. Телефони у форматі +380XXXXXXXXX.
servers:
  - url: /
    description: Поточний сервер — локальний або Render
tags:
  - name: Auth
    description: Сесії та відновлення пароля
  - name: Users
    description: Профіль авторизованого користувача
  - name: Categories
    description: Категорії каталогу
  - name: Goods
    description: Товари каталогу
  - name: Orders
    description: Оформлення та історія замовлень
  - name: Feedbacks
    description: Відгуки товарів
  - name: Subscriptions
    description: Email-підписки
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Реєстрація користувача
      operationId: registerUser
      description: Публічний маршрут. Телефон обов'язково +380XXXXXXXXX. У поточному контролері дубль email або tel повертає 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Користувача створено, встановлено три HttpOnly cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Вхід за телефоном і паролем
      operationId: loginUser
      description: Публічний маршрут. Поле phone у відповіді називається саме phone, не tel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserRequest"
      responses:
        "200":
          description: Вхід успішний, встановлено три HttpOnly cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Вихід з акаунта
      operationId: logoutUser
      description: Видаляє сесію за cookie sessionId, якщо її передано. Middleware авторизації на маршруті немає.
      responses:
        "204":
          description: Cookies очищено; тіла відповіді немає
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Оновлення сесії
      operationId: refreshUserSession
      description: Вимагає cookies sessionId і refreshToken; стара сесія видаляється.
      security:
        - sessionIdCookie: []
          refreshTokenCookie: []
      responses:
        "200":
          description: Сесію оновлено; встановлено нові cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/request-reset-email:
    post:
      tags:
        - Auth
      summary: Запросити відновлення пароля
      operationId: requestResetEmail
      description: Надсилає лист із посиланням і JWT, чинним 15 хвилин, для користувача з указаним email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetEmailRequest"
      responses:
        "200":
          description: Однакова відповідь для наявного й неіснуючого email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/reset-password:
    post:
      tags:
        - Auth
      summary: Встановити новий пароль
      operationId: resetPassword
      description: JWT чинний 15 хвилин; реалізація не забезпечує його одноразовість.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Пароль змінено, усі сесії користувача видалені
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/users:
    get:
      tags:
        - Users
      summary: Поточний користувач
      operationId: getCurrentUser
      description: "Повертає {user: ...} без пароля."
      security:
        - sessionIdCookie: []
          accessTokenCookie: []
      responses:
        "200":
          description: Дані профілю
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - Users
      summary: Оновити профіль
      operationId: updateCurrentUser
      description: Joi застосовує спільну константу PHONE_REG_EXP для поля tel. Дублікат номера повертає 400. Контролер нині повертає 400 також для інших помилок у catch.
      security:
        - sessionIdCookie: []
          accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Профіль оновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/categories:
    get:
      tags:
        - Categories
      summary: Категорії з пагінацією
      operationId: getCategories
      description: Контролер дозволяє додаткові query-параметри (Joi .unknown(true)); вони не впливають на вибірку.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
      responses:
        "200":
          description: Категорії та метадані
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/goods:
    get:
      tags:
        - Goods
      summary: Каталог товарів із фільтрами
      operationId: getGoods
      description: Фільтри можна поєднувати. Якщо задано обидві ціни, minPrice не може бути більшим за maxPrice.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 12
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ObjectId"
        - name: gender
          in: query
          required: false
          schema:
            type: string
            enum:
              - women
              - man
              - unisex
        - name: size
          in: query
          required: false
          schema:
            type: string
            enum:
              - XXS
              - XL
              - XS
              - S
              - M
              - L
              - XXL
        - name: minPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          required: false
          schema:
            type: number
            minimum: 0
      responses:
        "200":
          description: Товари та метадані
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/goods/{goodsId}:
    get:
      tags:
        - Goods
      summary: Один товар за ID
      operationId: getGoodById
      parameters:
        - name: goodsId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Об'єкт товару без JSON-обгортки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Good"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/orders:
    get:
      tags:
        - Orders
      summary: П'ять останніх замовлень користувача
      operationId: getOrders
      description: Сортування createdAt DESC і .limit(5). Фільтр за req.user._id.
      security:
        - sessionIdCookie: []
          accessTokenCookie: []
      responses:
        "200":
          description: Масив до п'яти скорочених об'єктів
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Orders
      summary: Оформити замовлення
      operationId: createOrder
      description: Публічний маршрут. Кількість кожної позиції — ціле число 1–100. Тепер tel використовує PHONE_REG_EXP (+380XXXXXXXXX). Контролер довіряє amount/status клієнта і не прив'язує авторизованого користувача до userId (відомі обмеження).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Замовлення створено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/orders/{orderId}:
    patch:
      tags:
        - Orders
      summary: Змінити статус замовлення
      operationId: updateOrderStatus
      description: Тільки для admin. Joi не підключений; контролер перевіряє перелік статусів. Некоректний ObjectId може дати 500.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      security:
        - sessionIdCookie: []
          accessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Замовлення з новим статусом
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/feedbacks:
    get:
      tags:
        - Feedbacks
      summary: Список відгуків товару
      operationId: getFeedbacks
      description: Передавай productId як query, не як частину URL. Відгуки впорядковані за _id DESC. За відсутності відгуків повертає порожній масив.
      parameters:
        - name: productId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 12
      responses:
        "200":
          description: Відгуки й пагінація
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbacksResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: "Контролер повертає {error: 'Failed to get feedbacks'}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to get feedbacks
                required:
                  - error
                additionalProperties: false
    post:
      tags:
        - Feedbacks
      summary: Створити відгук
      operationId: createFeedback
      description: Публічний маршрут. Поточний контролер створює Feedback із req.body без перевірки існування Good і не заповнює date/category та не оновлює Good.feedbacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
      responses:
        "201":
          description: Відгук створено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFeedbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/subscriptions:
    post:
      tags:
        - Subscriptions
      summary: Підписатися на розсилку
      operationId: createSubscription
      description: Публічний маршрут; у базі email має unique index. Email не приводиться автоматично до нижнього регістру.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Email додано до підписок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSubscriptionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Цей email уже підписаний
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    sessionIdCookie:
      type: apiKey
      in: cookie
      name: sessionId
      description: HttpOnly cookie із MongoDB ID сесії
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: accessToken
      description: HttpOnly cookie доступу (15 хвилин)
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HttpOnly cookie оновлення (1 доба)
  responses:
    BadRequest:
      description: "400: невалідні дані (Joi/Celebrate) або помилка контролера"
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Message"
              - $ref: "#/components/schemas/ValidationError"
    Unauthorized:
      description: "401: потрібна чинна сесія"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    Forbidden:
      description: "403: потрібна роль admin"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    NotFound:
      description: "404: ресурс не знайдено"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    InternalError:
      description: "500: помилка сервера"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
  schemas:
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      description: MongoDB ObjectId, 24 шістнадцяткові символи
      example: 6877b9f116ae59c7b60d0135
    PhoneNumber:
      type: string
      pattern: ^\+380\d{9}$
      example: "+380991234567"
      description: 'Той самий патерн, що й JS-константа PHONE_REG_EXP: /^\+380\d{9}$/'
    Email:
      type: string
      format: email
      example: olena@example.com
    Message:
      type: object
      properties:
        message:
          type: string
          example: Something went wrong. Please try again later.
      required:
        - message
      additionalProperties: true
    ValidationError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        validation:
          type: object
          additionalProperties: true
      required:
        - statusCode
        - error
        - message
      additionalProperties: true
    User:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
          example: Олена
        email:
          $ref: "#/components/schemas/Email"
        tel:
          $ref: "#/components/schemas/PhoneNumber"
        role:
          type: string
          enum:
            - user
            - admin
          example: user
        surname:
          type: string
          example: Коваленко
        city:
          type: string
          example: Київ
        postOffice:
          type: integer
          minimum: 1
          example: 12
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        __v:
          type: integer
          example: 0
      required:
        - _id
        - name
        - email
        - tel
        - role
      additionalProperties: true
      description: User без password; модель видаляє пароль у toJSON
    RegisterUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 32
          example: Олена
        tel:
          $ref: "#/components/schemas/PhoneNumber"
        email:
          type: string
          format: email
          maxLength: 64
          example: olena@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          example: Example123!
      required:
        - name
        - tel
        - email
        - password
      additionalProperties: false
    LoginUserRequest:
      type: object
      properties:
        tel:
          $ref: "#/components/schemas/PhoneNumber"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          example: Example123!
      required:
        - tel
        - password
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful.
        user:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/ObjectId"
            phone:
              $ref: "#/components/schemas/PhoneNumber"
          required:
            - id
            - phone
          additionalProperties: false
      required:
        - message
        - user
      additionalProperties: false
    RefreshResponse:
      type: object
      properties:
        message:
          type: string
          example: Session refreshed
      required:
        - message
      additionalProperties: false
    ResetEmailRequest:
      type: object
      properties:
        email:
          $ref: "#/components/schemas/Email"
      required:
        - email
      additionalProperties: false
    ResetEmailResponse:
      type: object
      properties:
        message:
          type: string
          example: Password reset email sent successfully
      required:
        - message
      additionalProperties: false
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOi...
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          example: NewPassword123!
      required:
        - token
        - password
      additionalProperties: false
    ResetPasswordResponse:
      type: object
      properties:
        message:
          type: string
          example: Password reset successfully
      required:
        - message
      additionalProperties: false
    CurrentUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
      additionalProperties: false
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 30
          example: Олена
        surname:
          type: string
          minLength: 2
          maxLength: 30
          example: Коваленко
        tel:
          $ref: "#/components/schemas/PhoneNumber"
        city:
          type: string
          minLength: 2
          example: Київ
        postOffice:
          type: integer
          minimum: 1
          example: 12
      additionalProperties: false
      description: PATCH приймає будь-яку комбінацію дозволених полів; Joi не вимагає мінімум одного поля.
    UpdateUserResponse:
      type: object
      properties:
        message:
          type: string
          example: Дані успішно оновлено
        user:
          $ref: "#/components/schemas/User"
      required:
        - message
        - user
      additionalProperties: false
    Category:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
          example: Сукні
        image:
          type: string
          example: https://example.com/category.webp
      required:
        - _id
        - name
      additionalProperties: true
    CategoriesPage:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        totalItems:
          type: integer
          minimum: 0
          example: 6
        page:
          type: integer
          minimum: 1
          example: 1
        perPage:
          type: integer
          minimum: 1
          example: 6
        totalPages:
          type: integer
          minimum: 0
          example: 1
      required:
        - categories
        - totalItems
        - page
        - perPage
        - totalPages
      additionalProperties: false
    CategoriesResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Successfully found categories!
        data:
          $ref: "#/components/schemas/CategoriesPage"
      required:
        - status
        - message
        - data
      additionalProperties: false
    Price:
      type: object
      properties:
        value:
          type: number
          example: 2599
        currency:
          type: string
          example: грн
      additionalProperties: false
    Good:
      type: object
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        name:
